trigger:
  branches:
    include:
      - main

# Agente self-hosted instalado no servidor on-premises da SEFAZ-RS
# Consulte o Guia de Implantação (seção 4.2) para instalar o agente
pool:
  name: sefaz-self-hosted-deployment-container-dev

variables:
  - group: siga-secrets   # grupo criado em Pipelines > Library com SIGA_AZURE_API_KEY
  SIGA_DIR: /opt/siga     # caminho onde o repositório está clonado no servidor

steps:
  - checkout: self

  - script: |
      set -e

      # Garante que o arquivo .env existe com as variáveis de ambiente
      cat > "$(SIGA_DIR)/.env" <<EOF
      SIGA_AI_PROVIDER=azure
      SIGA_AZURE_ENDPOINT=https://projeto-gesproc-cage.cognitiveservices.azure.com
      SIGA_AZURE_DEPLOYMENT=gpt-5.1-chat
      SIGA_AZURE_API_VERSION=2024-12-01-preview
      SIGA_AZURE_API_KEY=$(SIGA_AZURE_API_KEY)
      EOF

      # Atualiza o código e reinicia os containers
      cd "$(SIGA_DIR)"
      git pull origin main
      docker compose up -d --build --remove-orphans
      docker image prune -f

      echo "Deploy concluído: $(date)"
    displayName: "Deploy SIGA no servidor on-premises"
    env:
      SIGA_AZURE_API_KEY: $(SIGA_AZURE_API_KEY)
