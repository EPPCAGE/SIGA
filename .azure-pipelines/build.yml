name: gesproc-ci-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
      - dev
      - feature/*

pr:
  branches:
    include:
      - main
      - dev
      - feature/*

variables:
  - name: NODE_VERSION
    value: '20.x'
  - name: BUILD_AGENT_POOL
    value: 'sefaz-self-hosted'
  - name: DEPLOY_ARTIFACT_NAME
    value: 'siga-onprem-package'

stages:
  - stage: CI
    displayName: 'CI - Build, Test, Quality e Security'
    jobs:
      - job: Validate
        displayName: 'Validar aplicacao'
        pool:
          name: $(BUILD_AGENT_POOL)
        steps:
          - checkout: self
            clean: true
            fetchDepth: 0

          - task: NodeTool@0
            displayName: 'Instalar Node.js $(NODE_VERSION)'
            inputs:
              versionSpec: '$(NODE_VERSION)'

          - task: AdvancedSecurity-Codeql-Init@1
            displayName: 'GHAS - Init'
            inputs:
              languages: 'javascript'
              enableAutomaticCodeQLInstall: true

          - task: SonarCloudPrepare@3
            displayName: 'SonarCloud - Preparar'
            inputs:
              SonarCloud: 'sonarcloud-gesproc'
              organization: 'sefaz-rs'
              scannerMode: 'CLI'
              configMode: 'file'
              configFile: 'sonar-project.properties'
              extraProperties: |
                sonar.links.ci=$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)

          - script: npm ci
            displayName: 'npm ci'

          - script: npm run check:encoding
            displayName: 'Validar encoding'

          - script: npm run test:coverage
            displayName: 'Testes + cobertura'

          - task: PublishTestResults@2
            displayName: 'Publicar resultados de teste'
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '**/junit.xml'
              testRunTitle: 'SIGA - Testes'
              failTaskOnFailedTests: true

          - task: PublishCodeCoverageResults@2
            displayName: 'Publicar cobertura'
            condition: succeededOrFailed()
            inputs:
              codeCoverageTool: 'Cobertura'
              summaryFileLocation: '$(System.DefaultWorkingDirectory)/coverage/cobertura-coverage.xml'
              reportDirectory: '$(System.DefaultWorkingDirectory)/coverage'
              failIfCoverageEmpty: false

          - task: AdvancedSecurity-Dependency-Scanning@1
            displayName: 'GHAS - Dependency scanning'

          - task: AdvancedSecurity-Codeql-Analyze@1
            displayName: 'GHAS - Analyze'

          - task: AdvancedSecurity-Publish@1
            displayName: 'GHAS - Publish'

          - task: AdvancedSecurity-Gating-Local@1
            displayName: 'GHAS - Gating'
            condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/pull/'))
            inputs:
              alertSeverityCriteria: 'critical, high, warning, medium, error, low, note'
              alertTypeCriteria: 'dependency, code, secret'
              blockOnNewFindings: true
            continueOnError: true

          - task: SonarCloudAnalyze@3
            displayName: 'SonarCloud - Analyze'

          - task: SonarCloudPublish@3
            displayName: 'SonarCloud - Publish'
            inputs:
              pollingTimeoutSec: '300'

  - stage: Package
    displayName: 'Package - Artefato on-prem'
    dependsOn: CI
    condition: succeeded()
    jobs:
      - job: BuildPackage
        displayName: 'Montar pacote de deploy'
        pool:
          name: $(BUILD_AGENT_POOL)
        steps:
          - checkout: self
            clean: true

          - task: PowerShell@2
            displayName: 'Gerar pacote de deploy'
            inputs:
              filePath: 'scripts/build-onprem-package.ps1'
              arguments: >
                -OutputPath "$(Build.ArtifactStagingDirectory)\package"

          - task: PublishPipelineArtifact@1
            displayName: 'Publicar artefato on-prem'
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/package'
              artifact: '$(DEPLOY_ARTIFACT_NAME)'
              publishLocation: 'pipeline'
