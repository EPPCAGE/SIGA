name: Daily Backup

on:
  schedule:
    - cron: '0 3 * * *'   # 00:00 BRT (UTC-3) todo dia
  workflow_dispatch:       # permite rodar manualmente quando quiser

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install @supabase/supabase-js

      - name: Executar backup
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/backup.js

      - name: Commit e push do backup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          DATE=$(date +%Y-%m-%d)
          git add backups/
          git diff --staged --quiet && echo "Sem mudanças no backup." || \
            git commit -m "backup: $DATE [skip ci]" && \
            git push origin main
