services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: siga-backend
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      SIGA_DATA_FILE: /data/local-data.json
      SIGA_MAX_BODY_BYTES: 52428800
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: siga-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped
