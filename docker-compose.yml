services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: siga-backend
    ports:
      - "3000:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      # Caminho dentro do container — mapeado para ./data no host via volume abaixo.
      # Em desenvolvimento local (sem Docker): padrão é <raiz>/backups/local-data.json
      SIGA_DATA_FILE: /data/local-data.json
      SIGA_AUTO_BACKUP_ENABLED: ${SIGA_AUTO_BACKUP_ENABLED:-true}
      SIGA_AUTO_BACKUP_INTERVAL_DAYS: ${SIGA_AUTO_BACKUP_INTERVAL_DAYS:-3}
      SIGA_AUTO_BACKUP_HOUR: ${SIGA_AUTO_BACKUP_HOUR:-0}
      SIGA_AUTO_BACKUP_MINUTE: ${SIGA_AUTO_BACKUP_MINUTE:-0}
      SIGA_BACKUP_DIR: ${SIGA_BACKUP_DIR:-/data/backups}
      SIGA_MAX_BODY_BYTES: 52428800
      # ── IA / Azure OpenAI (GPT-5.1) ──────────────────────────────────
      # Defina as variáveis abaixo no arquivo .env do servidor (nunca aqui).
      # O Docker Compose lê o .env automaticamente.
      SIGA_AI_PROVIDER: ${SIGA_AI_PROVIDER:-github-models}
      SIGA_AI_TOKEN: ${SIGA_AI_TOKEN}
      SIGA_AI_MODEL: ${SIGA_AI_MODEL:-openai/gpt-4.1-mini}
      SIGA_AI_FALLBACK_MODELS: ${SIGA_AI_FALLBACK_MODELS:-}
      SIGA_AI_API_URL: ${SIGA_AI_API_URL:-https://models.github.ai/inference/chat/completions}
      SIGA_AZURE_ENDPOINT: ${SIGA_AZURE_ENDPOINT:-https://projeto-gesproc-cage.cognitiveservices.azure.com}
      SIGA_AZURE_DEPLOYMENT: ${SIGA_AZURE_DEPLOYMENT:-gpt-5.1-chat}
      SIGA_AZURE_API_VERSION: ${SIGA_AZURE_API_VERSION:-2024-12-01-preview}
      SIGA_AZURE_API_KEY: ${SIGA_AZURE_API_KEY}
      SIGA_AUTH_MODE: ${SIGA_AUTH_MODE:-local}
      SIGA_ENTRA_TENANT_ID: ${SIGA_ENTRA_TENANT_ID:-}
      SIGA_ENTRA_API_CLIENT_ID: ${SIGA_ENTRA_API_CLIENT_ID:-}
      SIGA_ENTRA_API_AUDIENCE: ${SIGA_ENTRA_API_AUDIENCE:-}
      SIGA_PUBLIC_URL: ${SIGA_PUBLIC_URL:-}
      SIGA_ADMIN_EMAILS: ${SIGA_ADMIN_EMAILS:-}
      SIGA_EDITOR_EMAILS: ${SIGA_EDITOR_EMAILS:-}
      SIGA_SMTP_HOST: ${SIGA_SMTP_HOST:-}
      SIGA_SMTP_PORT: ${SIGA_SMTP_PORT:-587}
      SIGA_SMTP_SECURE: ${SIGA_SMTP_SECURE:-false}
      SIGA_SMTP_STARTTLS: ${SIGA_SMTP_STARTTLS:-true}
      SIGA_SMTP_USER: ${SIGA_SMTP_USER:-}
      SIGA_SMTP_PASS: ${SIGA_SMTP_PASS:-}
      SIGA_SMTP_FROM_EMAIL: ${SIGA_SMTP_FROM_EMAIL:-}
      SIGA_SMTP_FROM_NAME: ${SIGA_SMTP_FROM_NAME:-SIGA}
      # ── IA / GitHub Copilot (fallback) ───────────────────────────────
      # SIGA_AI_TOKEN: ${SIGA_AI_TOKEN}
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: siga-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${SIGA_FRONTEND_PORT:-8081}:8080"
      - "${SIGA_FRONTEND_HTTPS_PORT:-443}:8443"
    restart: unless-stopped
