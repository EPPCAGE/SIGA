# ============================================================
# SonarCloud — Configuracao do Projeto GESPROC
# Organizacao: eppcage  |  Projeto: gesproc
# Service connection: sonarcloud-gesproc
# ============================================================

sonar.projectKey=eppcage_gesproc
sonar.organization=eppcage
sonar.projectName=GESPROC - CAGE Gestao de Processos
sonar.projectVersion=1.0

# Fontes
sonar.sources=.
sonar.tests=tests/
sonar.inclusions=**/*.js,**/*.html,**/*.css

sonar.exclusions=\
  **/node_modules/**,\
  **/coverage/**,\
  **/.claude/**,\
  **/dist/**,\
  **/obfuscate.js,\
  **/scripts/migrate-*.js,\
  **/scripts/backup.js,\
  **/backups/**,\
  junit.xml,\
  npm-audit-report.json

sonar.test.inclusions=**/tests/**/*.test.js

# Cobertura — gerado por: npm run test:coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.testExecutionReportPaths=junit.xml

sonar.sourceEncoding=UTF-8
