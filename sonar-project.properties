# ============================================================
# SonarCloud — Configuração do Projeto SIGA
# Organização: EPPCAGE  |  Projeto: SIGA
# Cadastrar service connection "SonarCloud" no Azure DevOps antes de rodar.
# ============================================================

sonar.projectKey=eppcage_gesproc
sonar.organization=eppcage
sonar.projectName=gesproc — Sistema Integrado de Gestão e Auditoria
sonar.projectVersion=1.0

# ── Fontes ────────────────────────────────────────────────────
sonar.sources=.
sonar.tests=tests/

sonar.inclusions=**/*.js,**/*.html,**/*.css

# Exclui dependências, artefatos gerados e utilitários de build
sonar.exclusions=\
  **/node_modules/**,\
  **/coverage/**,\
  **/.claude/**,\
  **/dist/**,\
  **/obfuscate.js,\
  **/scripts/migrate-*.js,\
  **/scripts/backup.js,\
  **/scripts/workspace-csv-stream.js,\
  junit.xml,\
  npm-audit-report.json

sonar.test.inclusions=**/tests/**/*.test.js

# ── Cobertura ─────────────────────────────────────────────────
# Gerado por: npm run test:coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.testExecutionReportPaths=junit.xml

# ── Qualidade ─────────────────────────────────────────────────
sonar.sourceEncoding=UTF-8

# Duplicação: tolerância de 3% para HTML gerado
sonar.cpd.js.minimumTokens=70
