# ============================================================
# SonarCloud — Configuração do Projeto SIGA
# Organização: sefaz-rs  |  Projeto: gesproc (EXISTENTE)
# Nota: Projeto já cadastrado. Não criar novo.
# ============================================================

sonar.projectKey=sefaz-rs_gesproc
sonar.organization=sefaz-rs
sonar.projectName=gesproc — Sistema Integrado de Gestão e Auditoria
sonar.projectVersion=1.0

# ── Fontes ────────────────────────────────────────────────────
sonar.sources=.
sonar.tests=tests/

sonar.inclusions=**/*.js,**/*.html,**/*.css

# Exclui dependências, artefatos gerados e utilitários de build
sonar.exclusions=\
  **/node_modules/**,\
  **/coverage/**,\
  **/.claude/**,\
  **/.git/**,\
  **/dist/**,\
  **/backups/**,\
  **/*.bak,\
  **/index.html.backup*,\
  **/index.html.BACKUP*,\
  **/index.html.bak*,\
  **/*backup*,\
  **/tmp-*.js,\
  **/tmp-*.html,\
  **/tmp-*.log,\
  **/frontend.*.log,\
  **/backend.*.log,\
  **/index-sonar-zerado.html,\
  **/index.sonar-refatorado.html,\
  **/scripts/migrate-*.js,\
  **/scripts/backup.js,\
  **/scripts/workspace-csv-stream.js,\
  junit.xml,\
  npm-audit-report.json

sonar.test.inclusions=**/tests/**/*.test.js

# ── Cobertura ─────────────────────────────────────────────────
# Gerado por: npm run test:coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.junit.reportPaths=junit.xml

# ── Qualidade ─────────────────────────────────────────────────
sonar.sourceEncoding=UTF-8

sonar.cpd.js.minimumTokens=70
